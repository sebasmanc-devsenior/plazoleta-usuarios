# Configuración de pruebas: H2 en memoria con compatibilidad MySQL. Las pruebas nunca
# tocan la base MySQL real (plazoleta_users) que se usa para ejecutar el servicio.
spring.datasource.url=jdbc:h2:mem:plazoleta_users;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=test-only-secret-key-with-at-least-32-bytes!!
app.internal.token=test-internal-token
app.plazoleta.base-url=http://localhost:1
app.bootstrap.admin.email=
app.bootstrap.admin.password=
